name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build packages
        env:
          VERSION: ${{ github.ref_name }}
          QWEK_DEFAULT_BACKEND_URL: ${{ vars.QWEK_DEFAULT_BACKEND_URL }}
        run: |
          if [[ -z "$QWEK_DEFAULT_BACKEND_URL" ]]; then
            echo "error: set the QWEK_DEFAULT_BACKEND_URL repository variable" >&2
            exit 1
          fi
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*.tar.gz \
            dist/qwek-checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
